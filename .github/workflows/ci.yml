name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Không khai `version` ở đây: pnpm/action-setup tự đọc `packageManager` trong
      # package.json. Khai đồng thời cả hai nơi sẽ lỗi "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Cần pnpm-lock.yaml được commit. Sinh bằng `pnpm install` ở máy trước lần push đầu.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
